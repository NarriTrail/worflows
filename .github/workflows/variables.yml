name: 'Reading variables from repository workflow'
on: 
    'workflow_dispatch':
      inputs:
        username:
          description: 'select user'
          type: choice
          options:
            - Narri
            - Kyathi
            - Mind ra


jobs:
  'validation_job':
   runs-on: 'ubuntu-latest'
   steps:
    - name: "checking the validation"
      run: |
           echo "you have selected ${{github.event.inputs.username}}"
           USERNAME=${{github.event.inputs.username}}
           echo "validating..."
           if [ "$USERNAME" != "Narri" ];then
             echo "::error::Invalid user '$USERNAME'"
             exit 1
            fi

  'varibales_reading':
   needs: validation_job
   runs-on: 'ubuntu-latest'
   steps:
    - name: 'checkout to repository'
      uses: 'actions/checkout@v4'
    - name: 'fetching varibles'
      run: |
           echo  "my name is ${{vars.NAME}}"
           echo "I'm a ${{vars.ROLE}}"
