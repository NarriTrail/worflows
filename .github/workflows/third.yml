name: pipe bash

on: 'workflow_dispatch'

jobs:
  'multi_commands':
   runs-on: ubuntu-latest
   steps:
     - name: 'checkout into code'
       uses: actions/checkout@v4
     - name: 'multi commands with pipe'
       run: |
           ls -ltr
           echo 'hello world'
           date
           pwd
           cat index.js
           echo 'job completed'

     - name: 'using upload artifact'
       uses: actions/upload-artifact@v4
       with:
         name: 'bashingFile'
         path: ./bashfile.sh

  'file_execution':
     runs-on: ubuntu-latest
     needs: 'multi_commands'
     steps:
       - name: 'using download artifact'
         uses: actions/download-artifact@v4
         with:
           name: bashingFile
           path: ./downloadFiles
       - name: 'access given'
         run: |
             cd downloadFiles
             chmod +x bashfile.sh
             cat bashfile.sh
              ./bashfile.sh